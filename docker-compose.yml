services:
  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_PORT=${DATABASE_PORT}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/core:/code/core
    depends_on:
      database:
        condition: service_healthy
    tty: true

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"

  database:
    image: postgres:18.6-trixie
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: example
      POSTGRES_DB: sovereign_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql

  adminer:
    image: adminer:6.0.1-standalone
    restart: always
    ports:
      - 8080:8080

volumes:
  pgdata: