# Disposable Postgres for `pytest` (see backend/tests/conftest.py). Kept
# separate from docker-compose.yml's `database` service so backend tests
# never touch the dev stack's live data — that collision (a headless
# Playwright run and manual browser testing hitting the same history table)
# is the whole reason this test suite exists. No named volume: every
# `down -v` (or a fresh `up`) starts from an empty, schema-only database.
services:
  test-database:
    image: postgres:18.6-trixie
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs:
      - /var/lib/postgresql
